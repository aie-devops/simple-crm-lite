info:
  name: Add another new customer
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/customers"
  body:
    type: json
    data: |-
      {
        "firstName": "Natasha",
        "lastName": "Romanoff",
        "email": "natasha@shield.gov",
        "contactNo": "44455566",
        "jobTitle": "Agent",
        "yearOfBirth": 1985
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
  scripts:
    - type: tests
      code: |-
        test("returns Natasha with an id", function() {
          expect(res.body.id).to.be.a("number");
          expect(res.body.firstName).to.equal("Natasha");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
