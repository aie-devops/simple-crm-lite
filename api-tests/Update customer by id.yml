info:
  name: Update customer by id
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/customers/{{customerId}}"
  body:
    type: json
    data: |-
      {
        "firstName": "Tony",
        "lastName": "Stark",
        "email": "ironman@starkindustries.com",
        "contactNo": "55566677",
        "jobTitle": "Superhero CEO",
        "yearOfBirth": 1980
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("returns the updated customer", function() {
          expect(res.body.id).to.equal(bru.getVar("customerId"));
          expect(res.body.firstName).to.equal("Tony");
          expect(res.body.jobTitle).to.equal("Superhero CEO");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
