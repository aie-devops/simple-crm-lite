info:
  name: Add a new customer
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}"
  body:
    type: json
    data: |
      {
        "firstName": "John",
        "lastName": "Doe",
        "email": "john@doe.com",
        "contactNo": "55566677",
        "jobTitle": "Boss",
        "yearOfBirth": 1980
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
