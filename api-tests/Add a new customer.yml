info:
  name: Add a new customer
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/customers"
  body:
    type: json
    data: |-
      {
        "firstName": "John",
        "lastName": "Doe",
        "email": "john@doe.com",
        "contactNo": "55566677",
        "jobTitle": "Boss",
        "yearOfBirth": 1980
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
  scripts:
    - type: after-response
      code: |-
        // Save the new customer's id for the next requests
        bru.setVar("customerId", res.body.id);
    - type: tests
      code: |-
        test("returns the new customer with an id", function() {
          expect(res.body.id).to.be.a("number");
          expect(res.body.firstName).to.equal("John");
          expect(res.body.email).to.equal("john@doe.com");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
